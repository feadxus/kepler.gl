name: Build Multi-Arch Docker Image & Sync to Drive

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

env:
  IMAGE_NAME: kepler.gl

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 检出代码
      - name: 🐙 Checkout Repository
        uses: actions/checkout@v4

      # 2️⃣ 清理 Runner 磁盘空间
      - name: 🧹 Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      # 3️⃣ 配置 QEMU 模拟器
      - name: 🐢 Setup QEMU
        uses: docker/setup-qemu-action@v3

      # 4️⃣ 初始化 Docker Buildx 构建器
      - name: 🛠️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5️⃣ 登录到 Docker Hub
      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6️⃣ 提取镜像 Tag 标签元数据
      - name: 🏷️ Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      # 7️⃣ 构建多架构镜像 (amd64 + arm64) 并直接推送至 Docker Hub
      - name: 🚀 Build and Push Multi-Arch Image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 8️⃣ 专门构建多架构本地 OCI 归档包 (用于备份到网盘)
      - name: 📦 Export Multi-Arch OCI Archive for Backup
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=./kepler.gl_multiarch.tar
          cache-from: type=gha

      # 9️⃣ 安装 xz 与 rclone 工具
      - name: 📦 Install Packaging Dependencies & rclone
        run: |
          sudo apt update
          sudo apt install -y xz-utils curl
          curl https://rclone.org/install.sh | sudo bash

      # 🔟 部署 rclone 配置文件
      - name: ⚙️ Setup rclone Config
        env:
          RCLONE_SECRET_DATA: ${{ secrets.GOOGLE_FEADXUS_DRIVE }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_SECRET_DATA" > ~/.config/rclone/rclone.conf

      # 1️⃣1️⃣ 验证 rclone 连通性
      - name: 🔍 Verify rclone Status
        run: |
          rclone version
          rclone listremotes

      # 1️⃣2️⃣ xz 多核极限压缩多架构归档
      - name: 🗜️ Compress Archive with xz
        run: |
          xz -T0 -6 kepler.gl_multiarch.tar

      # 1️⃣3️⃣ 显示压缩文件大小
      - name: 📏 Show Archive Size
        run: |
          ls -lh kepler.gl_multiarch.tar.xz

      # 1️⃣4️⃣ 创建 Google Drive 文件夹
      - name: 📁 Create Google Drive Directory
        run: |
          rclone mkdir FEADXUS-Google-Drive:/backup || true

      # 1️⃣5️⃣ 上传至 Google Drive
      - name: ☁️ Upload Archive to Google Drive
        run: |
          rclone copy \
            kepler.gl_multiarch.tar.xz \
            FEADXUS-Google-Drive:/backup/ \
            --progress

      # 1️⃣6️⃣ 校验网盘文件
      - name: ✅ Verify Google Drive Upload
        run: |
          echo "🎉 搬运成功! 网盘文件清单如下:"
          rclone lsf FEADXUS-Google-Drive:/backup/
