name: Build, Push to Docker Hub & Upload to Google Drive

on:
  workflow_dispatch: # 🎯 允许在 GitHub Actions 页面手动点击按钮触发运行

jobs:
  build-push-and-upload:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 检出项目源代码
      - name: 🐙 Checkout Repository
        uses: actions/checkout@v4.2.2

      # 2️⃣ 清理 Runner 磁盘空间 (规避构建 kepler.gl 庞大前端依赖时磁盘空间不足)
      - name: 🧹 Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      # 3️⃣ 配置 QEMU (为交叉编译 arm64 架构提供模拟支持)
      - name: 🐢 Setup QEMU
        uses: docker/setup-qemu-action@v3

      # 4️⃣ 初始化 Docker Buildx 构建器
      - name: 🛠️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      # 5️⃣ 登录到 Docker Hub 官方镜像仓库
      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }} # 💡 需在 GitHub Secrets 中配置
          password: ${{ secrets.DOCKERHUB_TOKEN }}    # 💡 需在 GitHub Secrets 中配置

      # 6️⃣ 提取并自动生成 Docker 镜像标签与元数据
      - name: 🏷️ Extract Metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/kepler-gl
          tags: |
            type=raw,value=latest
          flavor: |
            latest=auto
            prefix=

      # 7️⃣ 编译并直接推送到 Docker Hub 账号 (完美支持 amd64 和 arm64 架构)
      - name: 🚀 Build and Push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile # 💡 准确引用 kepler.gl 官方自带的生产环境多阶段 Dockerfile
          platforms: linux/amd64,linux/arm64 # 🎯 生产并打包双架构 Manifest 媒介
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # build-args: |
          #   MapboxAccessToken=${{ secrets.MAPBOX_ACCESS_TOKEN }} # 💡 如果你想在编译期把密匙写死在镜像中，可在 GitHub Secrets 配置并取消此两行注释

      # 8️⃣ 安装本地压缩与传输依赖工具
      - name: 📦 Install Packaging Dependencies
        run: |
          sudo apt update
          sudo apt install -y gzip xz-utils curl

      # 9️⃣ 安装 rclone 网盘同步工具
      - name: ⚡ Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      # 🔟 部署 rclone 授权配置文件
      - name: ⚙️ Setup rclone Config
        env:
          RCLONE_SECRET_DATA: ${{ secrets.GOOGLE_FSXEDX_DRIVE }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_SECRET_DATA" > ~/.config/rclone/rclone.conf

      # 1️⃣1️⃣ 验证 rclone 配置及连通性
      - name: 🔍 Verify rclone Status
        run: |
          rclone version
          rclone listremotes

      # 1️⃣2️⃣ 在本地编译一个 amd64 副本镜像用于打包备份 (避开多架构无法在本地直接 load 的限制)
      - name: 🏗️ Build Local Copy for Backup
        run: |
          docker build \
            --platform linux/amd64 \
            -f docker/Dockerfile \
            -t kepler-gl:latest \
            .

      # 1️⃣3️⃣ 查看本地镜像列表确认生成成功
      - name: 🖼️ Show Local Docker Images
        run: |
          docker images

      # 1️⃣4️⃣ 导出 Docker 镜像为 tar 压缩文件
      - name: 💾 Save Docker Image to Archive
        run: |
          docker save \
            kepler-gl:latest \
            -o kepler_images.tar

      # 1️⃣5️⃣ 使用 xz 进行极限高比例压缩
      - name: 🗜️ Compress Archive with xz
        run: |
          xz -T0 -6 kepler_images.tar

      # 1️⃣6️⃣ 打印显示最终压缩包的文件大小
      - name: 📏 Show Archive Size
        run: |
          ls -lh kepler_images.tar.xz

      # 1️⃣7️⃣ 在 Google Drive 中创建备份存放目录
      - name: 📁 Create Google Drive Directory
        run: |
          rclone mkdir FEADXUS-Google-Drive:/backup || true

      # 1️⃣8️⃣ 上传压缩镜像文件至 Google Drive
      - name: ☁️ Upload Archive to Google Drive
        run: |
          rclone copy \
            kepler_images.tar.xz \
            FEADXUS-Google-Drive:/backup/ \
            --progress

      # 1️⃣9️⃣ 校验网盘文件, 确认安全送达
      - name: ✅ Verify Google Drive Upload
        run: |
          echo "🎉 搬运成功! 网盘文件清单如下:"
          rclone lsf FEADXUS-Google-Drive:/backup/
