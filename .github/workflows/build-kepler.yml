name: Build, Push to Docker Hub & Upload to Google Drive

on:
  workflow_dispatch: # 🎯 允许手动点击运行

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  # 💡 直接在此处定义你的镜像完整名称
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/geolibre:latest

jobs:
  build-push-and-upload:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ 检出项目源代码 (完整深度)
      - name: 🐙 Checkout Repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          submodules: 'recursive'

      # 2️⃣ 探测并记录项目原生的 Dockerfile 真实路径 (绝不移动文件)
      - name: 🛠️ Find Original Dockerfile
        run: |
          TARGET_DOCKERFILE=$(find . -maxdepth 3 -name "Dockerfile" | head -n 1)
          if [ -z "$TARGET_DOCKERFILE" ]; then
            echo "❌ 严重错误: 仓库中未找到任何 Dockerfile！"
            exit 1
          fi
          echo "✅ 找到项目原生 Dockerfile 路径: $TARGET_DOCKERFILE"
          echo "DOCKERFILE_PATH=$TARGET_DOCKERFILE" >> $GITHUB_ENV

      # 3️⃣ 清理 Runner 磁盘空间
      - name: 🧹 Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      # 4️⃣ 配置 QEMU
      - name: 🐢 Setup QEMU
        uses: docker/setup-qemu-action@v3

      # 5️⃣ 初始化 Docker Buildx 构建器
      - name: 🛠️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      # 6️⃣ 登录到 Docker Hub
      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7️⃣ 编译并强行推送到 Docker Hub (显式传递 IMAGE_NAME，防止空 Tag 导致跳过推送)
      - name: 🚀 Build and Push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 8️⃣ 安装本地压缩与传输依赖工具
      - name: 📦 Install Packaging Dependencies
        run: |
          sudo apt update
          sudo apt install -y gzip xz-utils curl

      # 9️⃣ 安装 rclone
      - name: ⚡ Install rclone
        run: |
          curl https://rclone.org | sudo bash

      # 🔟 部署 rclone 配置文件
      - name: ⚙️ Setup rclone Config
        env:
          RCLONE_SECRET_DATA: ${{ secrets.GOOGLE_FEADXUS_DRIVE }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_SECRET_DATA" > ~/.config/rclone/rclone.conf

      # 1️⃣1️⃣ 验证 rclone 连通性
      - name: 🔍 Verify rclone Status
        run: |
          rclone version
          rclone listremotes

      # 1️⃣2️⃣ 本地单架构编译副本 (用于备份上传)
      - name: 🏗️ Build Local Copy for Backup
        run: |
          docker build \
            --platform linux/amd64 \
            -f ${{ env.DOCKERFILE_PATH }} \
            -t ${{ env.IMAGE_NAME }} \
            .

      # 1️⃣3️⃣ 确认生成
      - name: 🖼️ Show Local Docker Images
        run: |
          docker images

      # 1️⃣4️⃣ 导出为 tar
      - name: 💾 Save Docker Image to Archive
        run: |
          docker save \
            ${{ env.IMAGE_NAME }} \
            -o geolibre_images.tar

      # 1️⃣5️⃣ xz 极限压缩
      - name: 🗜️ Compress Archive with xz
        run: |
          xz -T0 -6 geolibre_images.tar

      # 1️⃣6️⃣ 显示大小
      - name: 📏 Show Archive Size
        run: |
          ls -lh geolibre_images.tar.xz

      # 1️⃣7️⃣ 创建网盘目录
      - name: 📁 Create Google Drive Directory
        run: |
          rclone mkdir FEADXUS-Google-Drive:/backup || true

      # 1️⃣8️⃣ 上传至 Google Drive
      - name: ☁️ Upload Archive to Google Drive
        run: |
          rclone copy \
            geolibre_images.tar.xz \
            FEADXUS-Google-Drive:/backup/ \
            --progress

      # 1️⃣9️⃣ 校验网盘文件
      - name: ✅ Verify Google Drive Upload
        run: |
          echo "🎉 搬运成功! 网盘文件清单如下:"
          rclone lsf FEADXUS-Google-Drive:/backup/
