name: Build, Push to Docker Hub & Upload to Google Drive

on:
  workflow_dispatch: # 🎯 允许在 GitHub Actions 页面手动点击按钮触发运行

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build-push-and-upload:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ 检出项目源代码(开启 fetch-depth 和 submodules, 确保全量代码被下载)
      - name: 🐙 Checkout Repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          submodules: 'recursive'

      # 2️⃣ 校验并指定 Dockerfile 路径
      - name: 🛠️ Ensure Dockerfile Path Exists
        run: |
          if [ -f "docker/Dockerfile" ]; then
            echo "✅ 成功找到路径: docker/Dockerfile"
            echo "DOCKERFILE_PATH=docker/Dockerfile" >> $GITHUB_ENV
          elif [ -f "Dockerfile" ]; then
            echo "⚠️ 在根目录找到 Dockerfile"
            echo "DOCKERFILE_PATH=Dockerfile" >> $GITHUB_ENV
          else
            echo "❌ 严重错误: 无法找到 Dockerfile 文件，请检查代码仓库结构！"
            exit 1
          fi

      # 3️⃣ 清理 Runner 磁盘空间
      - name: 🧹 Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      # 4️⃣ 配置 QEMU (跨平台支持)
      - name: 🐢 Setup QEMU
        uses: docker/setup-qemu-action@v3

      # 5️⃣ 初始化 Docker Buildx 构建器
      - name: 🛠️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      # 6️⃣ 登录到 Docker Hub
      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7️⃣ 编译并推送到 Docker Hub (显式直接指定 Tag，规避 metadata 冲突)
      - name: 🚀 Build and Push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/kepler-gl:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 8️⃣ 安装本地压缩与传输依赖工具
      - name: 📦 Install Packaging Dependencies
        run: |
          sudo apt update
          sudo apt install -y gzip xz-utils curl

      # 9️⃣ 安装 rclone
      - name: ⚡ Install rclone
        run: |
          curl https://rclone.org | sudo bash

      # 🔟 部署 rclone 配置文件
      - name: ⚙️ Setup rclone Config
        env:
          RCLONE_SECRET_DATA: ${{ secrets.GOOGLE_FEADXUS_DRIVE }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_SECRET_DATA" > ~/.config/rclone/rclone.conf

      # 1️⃣1️⃣ 验证 rclone 连通性
      - name: 🔍 Verify rclone Status
        run: |
          rclone version
          rclone listremotes

      # 1️⃣2️⃣ 本地单架构编译副本 (用于导出打包到 Google Drive)
      - name: 🏗️ Build Local Copy for Backup
        run: |
          docker build \
            --platform linux/amd64 \
            -f ${{ env.DOCKERFILE_PATH }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/kepler-gl:latest \
            .

      # 1️⃣3️⃣ 确认生成
      - name: 🖼️ Show Local Docker Images
        run: |
          docker images

      # 1️⃣4️⃣ 导出为 tar
      - name: 💾 Save Docker Image to Archive
        run: |
          docker save \
            ${{ secrets.DOCKERHUB_USERNAME }}/kepler-gl:latest \
            -o kepler_images.tar

      # 1️⃣5️⃣ xz 极限压缩
      - name: 🗜️ Compress Archive with xz
        run: |
          xz -T0 -6 kepler_images.tar

      # 1️⃣6️⃣ 显示大小
      - name: 📏 Show Archive Size
        run: |
          ls -lh kepler_images.tar.xz

      # 1️⃣7️⃣ 创建网盘目录
      - name: 📁 Create Google Drive Directory
        run: |
          rclone mkdir FEADXUS-Google-Drive:/backup || true

      # 1️⃣8️⃣ 上传至 Google Drive
      - name: ☁️ Upload Archive to Google Drive
        run: |
          rclone copy \
            kepler_images.tar.xz \
            FEADXUS-Google-Drive:/backup/ \
            --progress

      # 1️⃣9️⃣ 校验网盘文件
      - name: ✅ Verify Google Drive Upload
        run: |
          echo "🎉 搬运成功! 网盘文件清单如下:"
          rclone lsf FEADXUS-Google-Drive:/backup/
